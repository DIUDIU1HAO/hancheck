[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "hancheck"
version = "0.1.0"
description = "面向中文项目的代码体检：扫出全角标点、零宽字符、GBK 编码、硬编码手机号等中文语境专属问题"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "DIUDIU1HAO" }]
keywords = ["lint", "chinese", "cjk", "fullwidth", "encoding", "privacy", "ai-generated-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Natural Language :: Chinese (Simplified)",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1"]

[project.scripts]
hancheck = "hancheck.cli:main"

[project.urls]
Homepage = "https://github.com/DIUDIU1HAO/hancheck"
Issues = "https://github.com/DIUDIU1HAO/hancheck/issues"

[tool.hatch.build.targets.wheel]
packages = ["hancheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
